<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KimAI">
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1B4B"/>
      <stop offset=".55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="k-mark" x1="128" y1="112" x2="384" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D0FE"/>
      <stop offset=".5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="k-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(372 132) scale(120)">
      <stop stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#k-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#k-glow)"/>
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="#C4B5FD" stroke-opacity=".18" stroke-width="2"/>

  <!-- K monogram: vertical stem + two diagonal arms -->
  <g fill="none" stroke="url(#k-mark)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 136v240"/>
    <path d="M336 136 192 262l144 114"/>
  </g>

  <!-- spark accent -->
  <circle cx="372" cy="132" r="22" fill="#67E8F9"/>
  <circle cx="372" cy="132" r="9" fill="#ECFEFF"/>
</svg>
